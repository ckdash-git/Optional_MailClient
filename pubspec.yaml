name: optional_mail_client
description: "Lightweight mail, calendar and contacts client for the Optional Mail master server."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.41.0"

# Every dependency must be permissively licensed (MIT, BSD or Apache-2.0).
# Check the license on pub.dev before adding anything here.
dependencies:
  flutter:
    sdk: flutter

  file_selector: ^1.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  http: ^1.6.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  table_calendar: ^3.3.0
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.0

flutter:
  uses-material-design: true

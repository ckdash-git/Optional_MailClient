name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  master:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: licences (fails on copyleft)
        run: ./scripts/check-licenses.sh
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o master ./cmd/master

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: licences (fails on copyleft)
        run: ./scripts/check-app-licenses.sh
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build master image (no push)
        run: docker build -t master:ci server
      - name: image refuses to start without keys
        run: |
          out=$(docker run --rm master:ci 2>&1 || true)
          echo "$out" | grep -q MASTER_VAULT_KEYS

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: build release app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: package the unsigned app
        run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app Runner-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: Runner-unsigned.zip
          if-no-files-found: error
